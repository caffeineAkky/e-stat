services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: e-stat-dev
    container_name: e-stat-dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # .next はホストの next dev / next build と共有すると、Turbopack のキャッシュが混ざって
      # 古いビルド結果が配信されるので、コンテナ専用のボリュームに切り離す
      - next_dev:/app/.next

volumes:
  node_modules:
  next_dev: